<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pet Page</title>
    <style>
        body { 
            font-family: Verdana;
            background-color: beige;
            padding: 65px;
            min-height: 1800px;
        }
        h1, h2 { color: darkcyan; }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: beige;
            color: darkcyan;
            padding: 14px 20px;
         }
         .pet-card { 
            position: relative;
            background-color: cyan;
            border: 5px solid darkblue;
            padding: 15px 25px;
         }

         .badge { 
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgb(153, 190, 239);
            color:azure;
            padding: 4px 8px;
         }
         .selection-label { 
            position: sticky;
            top: 55px;
            background-color: darkcyan;
            color:azure;
            padding: 10px 20px;
            margin: 15 px 0 8px;
         }
    </style>
</head>
<body>
    <div class="top-bar">My pet page</div>
    <h1>Say hi to Pedro</h1>

    <h2>About him</h2>
    <div class="list-item">Breed: Labrador</div>
    <div class="list-item">Age: 2 years old</div>
    
    <div class="special-note">Pet of the Month!</div>

    <div class="pet-card">
        <p>Pedro - Labrador, two years</p>
        <div class="badge">Adopted!<div>
    </div>

    <h2>Sticky</h2>
    <div class="section-label">More Pets available</div>
    <div class="list-item">Max - Havanese, 1 year</div>
    <div class="list-item">Luna - Tabby cat, 10 months</div>
    <div class="list-item">Ella - Poodles, 3 years</div>
</body>
</html>
